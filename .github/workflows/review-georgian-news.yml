name: Review Georgian news

on:
  workflow_dispatch:
    inputs:
      action:
        description: List pending stories, approve one, or reject one
        required: true
        default: list
        type: choice
        options:
          - list
          - approve
          - reject
      article_id:
        description: Required for approve or reject
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List pending Georgian stories
        if: ${{ inputs.action == 'list' }}
        env:
          EDITORIAL_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $EDITORIAL_TOKEN" \
            https://investors.ge/api/editorial/pending | python -m json.tool

      - name: Validate article ID
        if: ${{ inputs.action != 'list' }}
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
        run: |
          if ! [[ "$ARTICLE_ID" =~ ^[a-fA-F0-9]{16}$ ]]; then
            echo "A valid 16-character article ID is required" >&2
            exit 1
          fi

      - name: Record editorial decision
        if: ${{ inputs.action != 'list' }}
        env:
          EDITORIAL_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
          ARTICLE_ID: ${{ inputs.article_id }}
          ACTION: ${{ inputs.action }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $EDITORIAL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"articleId\":\"$ARTICLE_ID\",\"action\":\"$ACTION\"}" \
            https://investors.ge/api/editorial/review | python -m json.tool

