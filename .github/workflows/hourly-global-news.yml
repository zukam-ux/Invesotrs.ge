name: Hourly global financial news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Test Gemini translation without publishing news
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

concurrency:
  group: hourly-global-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Collect and translate global stories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          if ! node scripts/update-news.mjs; then
            echo "Initial collection failed; retrying the full collection in 45 seconds"
            sleep 45
            node scripts/update-news.mjs
          fi
      - name: Publish changed news data
        run: |
          if git diff --quiet -- data/global-news.json; then
            echo "No new stories to publish"
          else
            git config user.name "Investors.ge News Bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add data/global-news.json
            git commit -m "Update global financial news [skip netlify]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "News publication failed after 3 push attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
      - name: Send archive to Cloudflare D1
        env:
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 \
            -H "Authorization: Bearer $NEWS_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/global-news.json \
            https://investors-ge.makharashvili-zurab.workers.dev/api/news-ingest
