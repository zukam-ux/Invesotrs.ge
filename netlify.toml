[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/shared.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/shared.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
