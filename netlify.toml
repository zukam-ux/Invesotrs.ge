[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/market-data"
  to = "/.netlify/functions/market-data"
  status = 200
  force = true

[[redirects]]
  from = "/api/news-quotes"
  to = "/.netlify/functions/news-quotes"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/shared.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/asset-search.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/shared.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
